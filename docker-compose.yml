services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CLINICAL_API_KEYS=${CLINICAL_API_KEYS:-demo-key-123}
      - RATE_PER_MIN=${RATE_PER_MIN:-60}
      # Uncomment with real credentials to use live backends:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Persist audit logs outside the container
      - ./audit_logs:/app/audit_logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Mock vector DB sidecar: in production this would be pgvector / OpenSearch.
  # Included to document the intended topology; the demo uses the in-memory store.
  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=clinical
      - POSTGRES_PASSWORD=clinical
      - POSTGRES_DB=clinical_vectors
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["full"]   # start with: docker compose --profile full up

volumes:
  pgdata:
